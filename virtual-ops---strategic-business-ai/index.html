<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual OPS Hub - Powered by VOPSy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              navy: {
                900: '#0A1321',
                800: '#11213D',
                700: '#1A3052',
              },
              vorange: {
                DEFAULT: '#F7941D',
                500: '#F7941D',
                600: '#E68412',
              }
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0A1321;
            color: #f9fafb;
            margin: 0;
            overflow-x: hidden;
        }
        #root {
            min-height: 100vh;
        }
        .font-outfit {
            font-family: 'Outfit', sans-serif;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #1A3052;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #F7941D;
        }
        .glass {
            background: rgba(17, 33, 61, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.03);
        }
        .v-orange-glow {
            box-shadow: 0 0 20px rgba(247, 148, 29, 0.15);
        }
        .animate-in {
            animation-duration: 0.5s;
            animation-fill-mode: both;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .fade-in { animation-name: fadeIn; }
    </style>
